<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Note Master — Akıllı Çalışma Asistanı</title>
    <meta name="description" content="Ders notlarınızı analiz edin; özetler, interaktif çalışma kartları ve testler oluşturun.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="header-badge">⚡ EdTech AI Workspace</div>
        <h1>AI Note Master</h1>
        <p>Notlarınızı saniyeler içinde zengin çalışma kartlarına, özete ve testlere dönüştürün.</p>
    </header>

    <main class="container">
        <!-- Not Giriş Alanı -->
        <section class="input-card">
            <div class="card-header">
                <label for="noteInput">Ders Notlarınız / Metniniz</label>
            </div>
            <textarea id="noteInput" rows="9" placeholder="Çalışmak istediğiniz konu anlatımını, kitap özetini veya notlarınızı buraya yapıştırın..."></textarea>
            
            <div class="button-group">
                <button id="btnSummarize" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Özet Çıkar
                </button>
                <button id="btnFlashcards" class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2v16"></path></svg>
                    Flashcard Üret
                </button>
                <button id="btnQuestions" class="btn btn-accent">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Soru Bankası
                </button>
            </div>
        </section>

        <!-- Yükleniyor Göstergesi -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingText">Metin analiz ediliyor...</p>
        </div>

        <!-- Sonuç Ekranı -->
        <section id="resultSection" class="result-section hidden">
            <h2 id="resultTitle">Analiz Sonucu</h2>
            <div id="resultContent" class="result-content"></div>
        </section>
    </main>

    <footer id="contact">
        <h3 class="footer-title">İletişim & Bağlantılar</h3>
        <div class="footer-links">
            <a href="mailto:davuteren052@gmail.com">

                <span>davuteren052@gmail.com</span>
            </a>
            <a href="https://github.com/Davut-Eren-Ekici" target="_blank" rel="noopener">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                <span>GitHub</span>
